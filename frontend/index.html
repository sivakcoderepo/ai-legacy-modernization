<textarea id="vbcode"></textarea>
<button onclick="analyzeCode()">Analyze & Modernize</button>
<div id="output"></div>

<script>
async function analyzeCode() {
    const code = document.getElementById("vbcode").value;
    if (!code.trim()) { alert("Paste VB code first."); return; }

    // Clear previous output
    const outputDiv = document.getElementById("output");
    outputDiv.innerHTML = `
        <div class="card"><h3>Business Logic</h3><pre id="business_logic"></pre></div>
        <div class="card"><h3>Domain Model</h3><pre id="domain_model"></pre></div>
        <div class="card"><h3>Backend Design</h3><pre id="backend_design"></pre></div>
        <div class="card"><h3>Frontend Design</h3><pre id="frontend_design"></pre></div>
        <div class="card"><h3>Cloud Architecture</h3><pre id="cloud_design"></pre></div>
    `;

    // POST + stream response
    const res = await fetch("http://127.0.0.1:8000/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: code })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });

        // SSE-style parsing: "data: {...}\n\n"
        let parts = buffer.split("\n\n");
        buffer = parts.pop(); // keep incomplete chunk

        for (let part of parts) {
            if (!part.startsWith("data:")) continue;
            let jsonStr = part.replace(/^data:\s*/, "");
            try {
                const data = JSON.parse(jsonStr);

                // Append incremental updates
                if (data.agent && data.output) {
                    const pre = document.getElementById(data.agent) || null;
                    if (pre) pre.textContent += data.output;
                }

                // Auto-scroll
                ['business_logic','domain_model','backend_design','frontend_design','cloud_design'].forEach(id => {
                    const pre = document.getElementById(id);
                    if (pre) pre.scrollTop = pre.scrollHeight;
                });

            } catch(e) { console.error("JSON parse error:", e, jsonStr); }
        }
    }
}
</script>
